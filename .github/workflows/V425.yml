name: SCALP LAB V4.25
on:
  push:
    paths: [research_v425.py, .github/workflows/V425.yml]
  workflow_dispatch:
jobs:
  research:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - run: pip install -r requirements.txt
      - run: python -u research_v425.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results/v425_*.csv results/summary_v425.md
          git diff --cached --quiet || git commit -m "Add V4.25 volatility normalized extreme research"
          git push
