name: SCALP LAB V4.23
on:
  push:
    paths: [research_v423.py, .github/workflows/V423.yml]
  workflow_dispatch:
jobs:
  research:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - run: pip install -r requirements.txt
      - run: python -u research_v423.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results/v423_*.csv results/summary_v423.md
          git diff --cached --quiet || git commit -m "Add V4.23 taker imbalance research"
          git push