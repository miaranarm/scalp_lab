name: V4.93 Shock External 2024
on:
  push:
    paths: [research_v493.py, .github/workflows/V493.yml]
  workflow_dispatch:
jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - run: pip install -r requirements.txt
      - run: python -u research_v493.py 2>&1 | tee results/v493_run.log
      - run: test -s results/v493_oos.csv && test -s results/summary_v493.md
      - uses: actions/upload-artifact@v4
        with: {name: v493-results, path: results/v493_*}