name: SCALP LAB V4.1 Research

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  research-v41:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run V4.1 research
        env:
          PYTHONUNBUFFERED: "1"
        run: |
          python -u research_v41.py \
            --symbols "BTCUSDT,ETHUSDT,SOLUSDT" \
            --intervals "5m,15m" \
            --days "730" \
            --capital "100" \
            --mc-runs "5000"

      - name: Show compact results
        if: always()
        run: |
          echo "===== V4.1 RESULTS ====="
          find results -maxdepth 1 -type f -print
          echo ""
          echo "===== V4.1 SUMMARY ====="
          if [ -f results/summary_v41.md ]; then
            sed -n '1,260p' results/summary_v41.md
          else
            echo "summary_v41.md not found"
            exit 1
          fi

      - name: Commit results
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results/
          if git diff --cached --quiet; then
            echo "No result changes to commit."
          else
            git commit -m "Research V4.1 results"
            git push
          fi
