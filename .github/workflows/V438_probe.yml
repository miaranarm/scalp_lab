name: SCALP LAB V4.3.8 SOURCE PROBE

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install -q requests

      - run: python -u backfill_probe_v438.py
