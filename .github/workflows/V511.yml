name: V511 STRICT ROBUST WALK FORWARD
on:
  push:
    paths:
      - "research_v511.py"
      - ".github/workflows/V511.yml"
  workflow_dispatch:
jobs:
  scan:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - run: pip install -r requirements.txt
      - run: python -u research_v511.py
      - uses: actions/upload-artifact@v4
        with:
          name: v511-results
          path: results/v511_*
      - uses: actions/upload-artifact@v4
        with:
          name: v511-summary
          path: results/summary_v511.md
      - name: Publish results
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results/v511_*
          git add results/summary_v511.md
          git diff --cached --quiet || git commit -m "Update V511 results"
          git pull --rebase origin main
          git push