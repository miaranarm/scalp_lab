name: V4.92 Shock Continuation
on:
  push:
    paths: [research_v492.py, .github/workflows/V492.yml]
  workflow_dispatch:
jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - run: pip install -r requirements.txt
      - run: python -u research_v492.py 2>&1 | tee results/v492_run.log
      - run: test -s results/v492_oos.csv && test -s results/summary_v492.md
      - uses: actions/upload-artifact@v4
        with: {name: v492-results, path: results/v492_*}