name: SCALP LAB V4.3.8.5 CANDLE TEST

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install -q websocket-client

      - name: Candle builder test
        run: timeout 40s python -u feed_test.py
