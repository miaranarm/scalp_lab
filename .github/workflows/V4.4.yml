name: SCALP LAB V4.4 Trade Level Forensics

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  forensic:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install
        run: pip install -q requests pandas numpy

      - name: Run V4.4
        env:
          PYTHONUNBUFFERED: "1"
        run: python -u research_v44.py

      - name: Show report
        if: always()
        run: |
          echo "===== V4.4 ====="
          if [ -f results/summary_v44.md ]; then
            cat results/summary_v44.md
          else
            echo "summary_v44.md absent"
          fi

          echo ""
          echo "===== FILES ====="
          ls -lh results/v44_* 2>/dev/null || true

      - name: Commit
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add research_v44.py results/v44_*.csv results/summary_v44.md

          if git diff --cached --quiet; then
            echo "Nothing to commit."
          else
            git commit -m "Research V4.4 trade level forensics"
            git push
          fi
