name: SCALP LAB V4.4 Trade Forensics

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: scalp-lab-v44
  cancel-in-progress: false

jobs:
  forensic:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install
        run: pip install -r requirements.txt

      - name: Run V4.4
        env:
          PYTHONUNBUFFERED: "1"
        run: |
          python -u research_v44.py \
            --symbols "BTCUSDT,ETHUSDT,SOLUSDT" \
            --intervals "5m,15m" \
            --days "730"

      - name: Show results
        run: |
          echo "===== V4.4 ====="
          cat results/summary_v44.md
          echo ""
          echo "===== FILES ====="
          ls -lh results/v44_*

      - name: Commit
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results/v44_*
          if git diff --cached --quiet; then
            echo "No V4.4 changes."
          else
            git commit -m "Research V4.4 trade forensics"
            git push
          fi
