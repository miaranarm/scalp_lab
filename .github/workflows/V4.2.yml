name: SCALP LAB V4.2 Diagnostic

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install
        run: pip install -q pandas numpy

      - name: Run V4.2
        run: python -u research_v42.py

      - name: Show results
        if: always()
        run: |
          echo "===== V4.2 ====="
          cat results/summary_v42.md
          echo ""
          echo "===== FILES ====="
          ls -lh results/v42_*

      - name: Commit
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results/ research_v42.py
          if git diff --cached --quiet; then
            echo "Nothing to commit."
          else
            git commit -m "Research V4.2 diagnostic"
            git push
          fi
