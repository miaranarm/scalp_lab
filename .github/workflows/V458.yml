name: SCALP LAB V4.5.8 Clean TP

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: scalp-lab-research
  cancel-in-progress: false

jobs:
  v458:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install -r requirements.txt -q

      - name: Run V4.5.8
        run: python -u research_v458.py

      - name: Compact output
        if: always()
        run: |
          echo "===== V4.5.8 ====="
          cat results/summary_v458.md
          echo ""
          cat results/v458_clean_missed_tp.csv

      - name: Commit
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results/v458_*.csv results/summary_v458.md
          git diff --cached --quiet && exit 0
          git commit -m "Research V4.5.8"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
