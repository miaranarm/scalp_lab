name: V4.36 Order Flow Confirmation
on:
  push: {paths: [research_v436.py,.github/workflows/V436.yml]}
  workflow_dispatch:
permissions: {contents: write}
concurrency: {group: scalp-lab-v436, cancel-in-progress: true}
jobs:
  research:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - run: pip install -r requirements.txt
      - run: python -u research_v436.py 2>&1 | tee results/v436_run.log
      - run: test -s results/v436_holdout.csv && test -s results/summary_v436.md
      - if: success()
        run: |
          printf "# V4.36 STATUS\n\nCOMPLETED\n\n%s\n" "$(date -u)" > results/v436_status.md
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results; git commit -m "V4.36 results" || true; git push
      - if: failure()
        run: |
          printf "# V4.36 STATUS\n\nFAILED\n\n%s\n" "$(date -u)" > results/v436_status.md
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results; git commit -m "V4.36 FAILED" || true; git push || true