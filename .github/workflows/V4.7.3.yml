name: V4.7.3 Live Continuity

on:
  workflow_dispatch:
  schedule:
    - cron: "50 * * * *"

permissions:
  contents: write

concurrency:
  group: v473-live
  cancel-in-progress: true

jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 14

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install -q websocket-client

      - name: V4.7.3
        run: python -u live_continuity_v473.py

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state/live_v4386.json
          git diff --cached --quiet || git commit -m "V4.7.3 SOLUSDT continuity"
          git push
