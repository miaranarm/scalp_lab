name: V4.66 Opening Range Walk Forward
on:
  push: {paths: [research_v466.py,.github/workflows/V466.yml]}
  workflow_dispatch:
permissions: {contents: write}
concurrency: {group: scalp-lab-v466, cancel-in-progress: true}
jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - run: pip install -r requirements.txt
      - run: python -u research_v466.py 2>&1 | tee results/v466_run.log
      - run: test -s results/v466_oos.csv && test -s results/summary_v466.md
      - if: success()
        run: |
          printf "# V4.66 STATUS\n\nCOMPLETED\n\n%s\n" "$(date -u)" > results/v466_status.md
          git config user.name "github-actions[bot]";git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f results/v466_* results/summary_v466.md;git commit -m "V4.66 results [skip ci]"||true;git push||true
      - if: failure()
        run: |
          printf "# V4.66 STATUS\n\nFAILED\n\n%s\n" "$(date -u)" > results/v466_status.md
          git config user.name "github-actions[bot]";git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f results/v466_*;git commit -m "V4.66 FAILED [skip ci]"||true;git push||true