name: V4.43 1H Trend Filter
on:
  push:
    paths: [research_v443.py,.github/workflows/V443.yml]
  workflow_dispatch:
permissions: {contents: write}
concurrency: {group: scalp-lab-v443, cancel-in-progress: true}
jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - run: pip install -r requirements.txt
      - run: python -u research_v443.py 2>&1 | tee results/v443_run.log
      - run: test -s results/v443_holdout.csv && test -s results/summary_v443.md
      - if: success()
        run: |
          printf "# V4.43 STATUS\n\nCOMPLETED\n\n%s\n" "$(date -u)" > results/v443_status.md
          git config user.name "github-actions[bot]"; git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results; git commit -m "V4.43 results" || true; git push
      - if: failure()
        run: |
          printf "# V4.43 STATUS\n\nFAILED\n\n%s\n" "$(date -u)" > results/v443_status.md
          git config user.name "github-actions[bot]"; git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results; git commit -m "V4.43 FAILED" || true; git push || true