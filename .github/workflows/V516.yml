name: V516 15m ATR EXITS
on:
  push:
    paths:
      - "research_v516.py"
      - ".github/workflows/V516.yml"
  workflow_dispatch:
jobs:
  scan:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - run: python -u research_v516.py
      - uses: actions/upload-artifact@v4
        with:
          name: v516-results
          path: results/v516_*
      - name: Publish results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results/v516_* results/summary_v516.md
          git diff --cached --quiet || git commit -m "Update V516 results"
          git fetch origin main
          git rebase origin/main
          git push
