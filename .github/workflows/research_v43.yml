name: SCALP LAB V4.3 TEST

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  v43-test:
    runs-on: ubuntu-latest

    timeout-minutes: 20

    steps:

      # ======================================================
      # CHECKOUT
      # ======================================================

      - name: Checkout repository
        uses: actions/checkout@v4

      # ======================================================
      # PYTHON
      # ======================================================

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # ======================================================
      # DEPENDENCIES
      # ======================================================

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install \
            requests==2.32.5 \
            pandas==2.2.3 \
            numpy==2.1.3 \
            tabulate

      # ======================================================
      # V4.3
      # ======================================================

      - name: Run SCALP LAB V4.3
        run: |
          set +e

          echo "=============================================="
          echo "SCALP LAB V4.3 TEST"
          echo "=============================================="
          echo "Symbols : BTCUSDT ETHUSDT SOLUSDT"
          echo "Interval: 1h"
          echo "History : 730 days"
          echo "MC runs : 0"
          echo "Random  : 0"
          echo "WF      : 180 / 45 / 45 days"
          echo "Holdout : 90 days"
          echo "=============================================="

          python -u research_v43.py \
            --symbols BTCUSDT ETHUSDT SOLUSDT \
            --intervals 1h \
            --days 730 \
            --capital 100 \
            --mc-runs 0 \
            --random-runs 0

          STATUS=$?

          echo "=============================================="
          echo "V4.3 EXIT CODE: $STATUS"
          echo "=============================================="

          exit $STATUS

      # ======================================================
      # SHOW RESULTS
      # ======================================================

      - name: Show result files
        if: always()
        run: |
          echo "=============================================="
          echo "RESULT FILES"
          echo "=============================================="

          if [ -d results ]; then
            find results \
              -maxdepth 1 \
              -type f \
              -printf '%f\n' \
              | sort
          else
            echo "No results directory"
          fi

      # ======================================================
      # SHOW SUMMARY
      # ======================================================

      - name: Show summary
        if: always()
        run: |
          echo "=============================================="
          echo "V4.3 SUMMARY"
          echo "=============================================="

          if [ -f results/summary_v43.md ]; then
            cat results/summary_v43.md
          else
            echo "summary_v43.md not found"
          fi

      # ======================================================
      # UPLOAD ARTIFACTS
      # ======================================================

      - name: Upload V4.3 results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scalp-lab-v43-results
          path: |
            results/*.csv
            results/*.md
          if-no-files-found: warn
          retention-days: 30
