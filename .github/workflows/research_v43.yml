name: SCALP LAB V4.3.1

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install
        run: |
          python -m pip install -q --upgrade pip
          pip install -q requests==2.32.5 pandas==2.2.3 numpy==2.1.3

      - name: Clean
        run: |
          rm -rf results
          mkdir -p results

      - name: Run
        run: |
          python -u research_v43.py \
            --symbols BTCUSDT ETHUSDT SOLUSDT \
            --intervals 1h \
            --days 730 \
            --capital 100 \
            --mc-runs 0 \
            --random-runs 0

      - name: Results
        if: always()
        run: |
          cat results/summary_v43.md 2>/dev/null || true
          ls -lh results/ 2>/dev/null || true

      - name: Upload
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scalp-lab-v43-results
          path: results/*
          retention-days: 30
