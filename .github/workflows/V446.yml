name: V4.46 Execution Reality
on:
  push: {paths: [research_v446.py,.github/workflows/V446.yml]}
  workflow_dispatch:
permissions: {contents: write}
concurrency: {group: scalp-lab-v446, cancel-in-progress: true}
jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - run: pip install -r requirements.txt
      - run: python -u research_v446.py 2>&1 | tee results/v446_run.log
      - run: test -s results/v446_execution.csv && test -s results/summary_v446.md
      - if: success()
        run: |
          printf "# V4.46 STATUS\n\nCOMPLETED\n\n%s\n" "$(date -u)" > results/v446_status.md
          git config user.name "github-actions[bot]"; git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results; git commit -m "V4.46 results" || true; git push
      - if: failure()
        run: |
          printf "# V4.46 STATUS\n\nFAILED\n\n%s\n" "$(date -u)" > results/v446_status.md
          git config user.name "github-actions[bot]"; git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results; git commit -m "V4.46 FAILED" || true; git push || true