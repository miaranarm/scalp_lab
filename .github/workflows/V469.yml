name: V4.69 ORB Realistic Cost
on:
  push: {paths: [research_v469.py,.github/workflows/V469.yml]}
  workflow_dispatch:
permissions: {contents: write}
concurrency: {group: scalp-lab-v469, cancel-in-progress: true}
jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - run: pip install -r requirements.txt
      - run: python -u research_v469.py 2>&1 | tee results/v469_run.log
      - run: test -s results/v469_oos.csv && test -s results/summary_v469.md
      - if: success()
        run: |
          printf "# V4.69 STATUS\n\nCOMPLETED\n\n%s\n" "$(date -u)" > results/v469_status.md
          git config user.name "github-actions[bot]";git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f results/v469_* results/summary_v469.md;git commit -m "V4.69 results [skip ci]"||true;git push||true
      - if: failure()
        run: |
          printf "# V4.69 STATUS\n\nFAILED\n\n%s\n" "$(date -u)" > results/v469_status.md
          git config user.name "github-actions[bot]";git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f results/v469_*;git commit -m "V4.69 FAILED [skip ci]"||true;git push||true