name: V4.81 Shock Volume
on:
  push: {paths: [research_v481.py,.github/workflows/V481.yml]}
  workflow_dispatch:
permissions: {contents: write}
concurrency: {group: scalp-lab-v481, cancel-in-progress: true}
jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - run: pip install -r requirements.txt
      - run: python -u research_v481.py 2>&1 | tee results/v481_run.log
      - run: test -s results/v481_oos.csv && test -s results/summary_v481.md
      - if: success()
        run: |
          printf "# V4.81 STATUS\n\nCOMPLETED\n\n%s\n" "$(date -u)" > results/v481_status.md
          git config user.name "github-actions[bot]";git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f results/v481_* results/summary_v481.md;git commit -m "V4.81 results [skip ci]"||true;git push||true