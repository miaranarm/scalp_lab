name: SCALP LAB V4.12 Entry Replay

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: scalp-lab-research
  cancel-in-progress: false

jobs:
  v412:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install -r requirements.txt -q

      - name: Run V4.12
        run: python -u research_v412.py

      - name: Results
        if: always()
        run: |
          echo "===== V4.12 ====="
          cat results/summary_v412.md 2>/dev/null || true

      - name: Commit
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add research_v412.py \
            .github/workflows/V412.yml \
            results/v412_*.csv \
            results/summary_v412.md

          if git diff --cached --quiet; then
            echo "No changes."
            exit 0
          fi

          git commit -m "Research V4.12 entry replay"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
