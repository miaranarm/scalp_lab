name: V4.75 Volatility Shock Reversal
on:
  push: {paths: [research_v475.py,.github/workflows/V475.yml]}
  workflow_dispatch:
permissions: {contents: write}
concurrency: {group: scalp-lab-v475, cancel-in-progress: true}
jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - run: pip install -r requirements.txt
      - run: python -u research_v475.py 2>&1 | tee results/v475_run.log
      - run: test -s results/v475_oos.csv && test -s results/summary_v475.md
      - if: success()
        run: |
          printf "# V4.75 STATUS\n\nCOMPLETED\n\n%s\n" "$(date -u)" > results/v475_status.md
          git config user.name "github-actions[bot]";git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f results/v475_* results/summary_v475.md;git commit -m "V4.75 results [skip ci]"||true;git push||true
      - if: failure()
        run: |
          printf "# V4.75 STATUS\n\nFAILED\n\n%s\n" "$(date -u)" > results/v475_status.md
          git config user.name "github-actions[bot]";git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f results/v475_*;git commit -m "V4.75 FAILED [skip ci]"||true;git push||true