name: SCALP LAB V4.22

on:
  push:
    paths:
      - research_v422.py
      - .github/workflows/V422.yml
      - results/summary_v417.md
      - results/summary_v418.md
      - results/summary_v419.md
      - results/summary_v420.md
      - results/summary_v421.md
  workflow_dispatch:

jobs:
  synth:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -u research_v422.py
      - name: Commit synthesis
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results/summary_v422.md
          git diff --cached --quiet || git commit -m "Add V4.22 survivorship synthesis"
          git push
