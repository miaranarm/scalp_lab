name: V4.68 ORB Bias Hold Walk Forward
on:
  push: {paths: [research_v468.py,.github/workflows/V468.yml]}
  workflow_dispatch:
permissions: {contents: write}
concurrency: {group: scalp-lab-v468, cancel-in-progress: true}
jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - run: pip install -r requirements.txt
      - run: python -u research_v468.py 2>&1 | tee results/v468_run.log
      - run: test -s results/v468_oos.csv && test -s results/summary_v468.md
      - if: success()
        run: |
          printf "# V4.68 STATUS\n\nCOMPLETED\n\n%s\n" "$(date -u)" > results/v468_status.md
          git config user.name "github-actions[bot]";git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f results/v468_* results/summary_v468.md;git commit -m "V4.68 results [skip ci]"||true;git push||true
      - if: failure()
        run: |
          printf "# V4.68 STATUS\n\nFAILED\n\n%s\n" "$(date -u)" > results/v468_status.md
          git config user.name "github-actions[bot]";git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f results/v468_*;git commit -m "V4.68 FAILED [skip ci]"||true;git push||true