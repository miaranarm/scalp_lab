name: SCALP LAB V4.5.9 Through

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: scalp-lab-research
  cancel-in-progress: false

jobs:
  v459:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install -r requirements.txt -q

      - name: Run V4.5.9
        run: python -u research_v459.py

      - name: Results
        if: always()
        run: |
          echo "===== V4.5.9 ====="
          cat results/summary_v459.md
          echo ""
          cat results/v459_through_audit.csv

      - name: Commit
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results/v459_*.csv results/summary_v459.md
          git diff --cached --quiet && exit 0
          git commit -m "Research V4.5.9"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
