name: V4.59 RSI2 Multi Market
on:
  push: {paths: [research_v459.py,.github/workflows/V459.yml]}
  workflow_dispatch:
permissions: {contents: write}
concurrency: {group: scalp-lab-v459, cancel-in-progress: true}
jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - run: pip install -r requirements.txt
      - run: python -u research_v459.py 2>&1 | tee results/v459_run.log
      - run: ls -lh results && test -s results/v459_oos.csv && test -s results/summary_v459.md
      - if: success()
        run: |
          printf "# V4.59 STATUS\n\nCOMPLETED\n\n%s\n" "$(date -u)" > results/v459_status.md
          git config user.name "github-actions[bot]";git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f results;git commit -m "V4.59 results"||true;git push
      - if: failure()
        run: |
          printf "# V4.59 STATUS\n\nFAILED\n\n%s\n" "$(date -u)" > results/v459_status.md
          git config user.name "github-actions[bot]";git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results;git commit -m "V4.59 FAILED"||true;git push||true