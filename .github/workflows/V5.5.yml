name: V5.5 Scalp Lab Readiness

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: scalp-lab-readiness
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: V5.5
        run: python -u readiness_v55.py
