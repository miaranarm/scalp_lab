name: SCALP LAB V4.11 Entry Quality

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: scalp-lab-research
  cancel-in-progress: false

jobs:
  v411:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install -r requirements.txt -q

      - name: Run V4.11
        run: python -u research_v411.py

      - name: Results
        if: always()
        run: |
          echo "===== V4.11 ====="
          cat results/summary_v411.md 2>/dev/null || true

      - name: Commit
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research_v411.py \
            .github/workflows/V411.yml \
            results/v411_*.csv \
            results/summary_v411.md
          if git diff --cached --quiet; then
            echo "No changes."
            exit 0
          fi
          git commit -m "Research V4.11 entry quality"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
