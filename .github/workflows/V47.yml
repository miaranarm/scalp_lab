name: SCALP LAB V4.7 Exit Forensics

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: scalp-lab-research
  cancel-in-progress: false

jobs:
  v47:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install -r requirements.txt -q

      - name: Run V4.7
        run: python -u research_v47.py

      - name: Results
        if: always()
        run: |
          echo "===== V4.7 ====="
          cat results/summary_v47.md 2>/dev/null || true

          echo "===== GLOBAL ====="
          cat results/v47_global.csv 2>/dev/null || true

          echo "===== EXCURSION ====="
          cat results/v47_excursion.csv 2>/dev/null || true

          echo "===== TIME ====="
          cat results/v47_time_excursion.csv 2>/dev/null || true

          echo "===== SL ====="
          cat results/v47_sl_excursion.csv 2>/dev/null || true

          echo "===== SIGNAL/EXIT ====="
          cat results/v47_signal_exit.csv 2>/dev/null || true

      - name: Commit
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research_v47.py .github/workflows/V47.yml results/v47_*.csv results/summary_v47.md
          git diff --cached --quiet && exit 0
          git commit -m "Research V4.7 exit forensics"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
