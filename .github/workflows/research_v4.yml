name: SCALP LAB V4 Research

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  research-v4:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # Versions figées (requirements.txt) plutôt que "pip install pandas
      # numpy requests" : ce dernier installe la toute dernière version à
      # chaque run (le run précédent a récupéré pandas 3.0.6, une version
      # majeure récente pouvant changer le comportement de rolling/ewm/
      # merge_asof sans prévenir). Figer les versions garantit un résultat
      # reproductible d'un run à l'autre.
      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run V4 research
        env:
          PYTHONUNBUFFERED: "1"
        run: |
          python -u research_v4.py \
            --symbols "BTCUSDT,ETHUSDT,SOLUSDT" \
            --intervals "1h" \
            --days "365" \
            --capital "100" \
            --mc-runs "5000"

      - name: Show compact results
        if: always()
        run: |
          echo "===== V4 RESULTS ====="
          find results -maxdepth 1 -type f -print
          echo ""
          echo "===== V4 SUMMARY ====="
          if [ -f results/summary_v4.md ]; then
            sed -n '1,220p' results/summary_v4.md
          else
            echo "summary_v4.md not found"
            exit 1
          fi

      - name: Commit results
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results/
          if git diff --cached --quiet; then
            echo "No result changes to commit."
          else
            git commit -m "Research V4 results"
            git push
          fi
