name: SCALP LAB V4 Research

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  research-v4:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy requests

      - name: Run V4 research
        env:
          PYTHONUNBUFFERED: "1"
        run: |
          python -u research_v4.py \
            --symbols "BTCUSDT,ETHUSDT,SOLUSDT" \
            --intervals "5m,15m" \
            --days "365" \
            --capital "100" \
            --mc-runs "5000"

      - name: Show compact results
        run: |
          echo "===== V4 RESULTS ====="
          find results -maxdepth 1 -type f -print
          echo ""
          echo "===== V4 SUMMARY ====="
          if [ -f results/summary_v4.md ]; then
            sed -n '1,220p' results/summary_v4.md
          else
            echo "summary_v4.md not found"
            exit 1
          fi

      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add results/

          if git diff --cached --quiet; then
            echo "No result changes to commit."
          else
            git commit -m "Research V4 results"
            git push
          fi
