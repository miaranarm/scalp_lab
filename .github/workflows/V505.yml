name: V505 PULLBACK OOS AUDIT
on:
  workflow_dispatch:
  push:
    paths: ["research_v505.py",".github/workflows/V505.yml"]
jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - run: pip install -r requirements.txt
      - run: python -u research_v505.py
      - uses: actions/upload-artifact@v4
        with: {name: v505-results, path: results/v505_*.csv}
      - uses: actions/upload-artifact@v4
        with: {name: v505-summary, path: results/summary_v505.md}
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results/v505_*.csv results/summary_v505.md
          git commit -m "results: V505 pullback OOS audit" || true
          git push || true
