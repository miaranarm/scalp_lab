name: V4.86 Taker Imbalance
on:
  push:
    paths: [research_v486.py, .github/workflows/V486.yml]
  workflow_dispatch:
jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - run: pip install -r requirements.txt
      - run: python -u research_v486.py 2>&1 | tee results/v486_run.log
      - run: test -s results/v486_oos.csv && test -s results/summary_v486.md
      - uses: actions/upload-artifact@v4
        with: {name: v486-results, path: results/v486_*}