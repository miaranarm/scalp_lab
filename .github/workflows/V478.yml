name: V4.78 Holdout Stress
on:
  push: {paths: [research_v478.py,.github/workflows/V478.yml]}
  workflow_dispatch:
permissions: {contents: write}
concurrency: {group: scalp-lab-v478, cancel-in-progress: true}
jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - run: pip install -r requirements.txt
      - run: python -u research_v478.py 2>&1 | tee results/v478_run.log
      - run: test -s results/v478_stress.csv && test -s results/summary_v478.md
      - if: success()
        run: |
          printf "# V4.78 STATUS\n\nCOMPLETED\n\n%s\n" "$(date -u)" > results/v478_status.md
          git config user.name "github-actions[bot]";git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f results/v478_* results/summary_v478.md;git commit -m "V4.78 stress [skip ci]"||true;git push||true