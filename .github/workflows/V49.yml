name: SCALP LAB V4.9 Path Edge

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: scalp-lab-research
  cancel-in-progress: false

jobs:
  v49:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install -r requirements.txt -q

      - name: Run V4.9
        run: python -u research_v49.py

      - name: Results
        if: always()
        run: |
          echo "===== V4.9 SUMMARY ====="
          cat results/summary_v49.md 2>/dev/null || true

          echo ""
          echo "===== GLOBAL ====="
          cat results/v49_global.csv 2>/dev/null || true

          echo ""
          echo "===== PATH ====="
          cat results/v49_path_edge.csv 2>/dev/null || true

          echo ""
          echo "===== EXIT/PATH ====="
          cat results/v49_exit_path_edge.csv 2>/dev/null || true

          echo ""
          echo "===== SIGNAL/PATH ====="
          cat results/v49_signal_path_edge.csv 2>/dev/null || true

          echo ""
          echo "===== MARKET/PATH ====="
          cat results/v49_market_path_edge.csv 2>/dev/null || true

          echo ""
          echo "===== REGIME/PATH ====="
          cat results/v49_regime_path_edge.csv 2>/dev/null || true

          echo ""
          echo "===== SIGNAL/REGIME/PATH ====="
          cat results/v49_signal_regime_path.csv 2>/dev/null || true

          echo ""
          echo "===== SIDE/PATH ====="
          cat results/v49_side_path_edge.csv 2>/dev/null || true

      - name: Commit
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add research_v49.py \
            .github/workflows/V49.yml \
            results/v49_*.csv \
            results/summary_v49.md

          if git diff --cached --quiet; then
            echo "No changes."
            exit 0
          fi

          git commit -m "Research V4.9 path edge forensics"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
