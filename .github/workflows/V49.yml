name: SCALP LAB V4.9.1

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: scalp-lab-research
  cancel-in-progress: false

jobs:
  v49:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install -r requirements.txt -q

      - name: Run
        run: python -u research_v49.py

      - name: Compact results
        if: always()
        run: |
          echo "===== V4.9.1 ====="
          cat results/summary_v49.md | head -80

      - name: Commit
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research_v49.py .github/workflows/V49.yml results/v49_*.csv results/summary_v49.md
          git diff --cached --quiet && exit 0
          git commit -m "Research V4.9.1 compact"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
