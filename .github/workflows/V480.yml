name: V4.80 Winner Filter Holdout
on:
  push: {paths: [research_v480.py,.github/workflows/V480.yml]}
  workflow_dispatch:
permissions: {contents: write}
concurrency: {group: scalp-lab-v480, cancel-in-progress: true}
jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - run: pip install -r requirements.txt
      - run: python -u research_v480.py 2>&1 | tee results/v480_run.log
      - run: test -s results/v480_holdout.csv && test -s results/summary_v480.md
      - if: success()
        run: |
          printf "# V4.80 STATUS\n\nCOMPLETED\n\n%s\n" "$(date -u)" > results/v480_status.md
          git config user.name "github-actions[bot]";git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f results/v480_* results/summary_v480.md;git commit -m "V4.80 holdout [skip ci]"||true;git push||true