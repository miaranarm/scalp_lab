name: V513 EXECUTION REALISTIC
on:
  push:
    paths:
      - "research_v513.py"
      - ".github/workflows/V513.yml"
  workflow_dispatch:
jobs:
  scan:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - run: python -u research_v513.py
      - uses: actions/upload-artifact@v4
        with:
          name: v513-results
          path: results/v513_*
      - name: Publish results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results/v513_*
          git add results/summary_v513.md
          git diff --cached --quiet || git commit -m "Update V513 results"
          git pull --rebase origin main
          git push
