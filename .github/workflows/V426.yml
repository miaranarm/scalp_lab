name: SCALP LAB V4.26
on:
  push:
    paths: [research_v426.py, .github/workflows/V426.yml]
  workflow_dispatch:
jobs:
  research:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - run: pip install -r requirements.txt
      - run: python -u research_v426.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results/v426_*.csv results/summary_v426.md
          git diff --cached --quiet || git commit -m "Add V4.26 volume shock research"
          git push
