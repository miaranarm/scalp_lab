name: SCALP LAB V4.31
on:
  push:
    paths: [research_v431.py,.github/workflows/V431.yml]
  workflow_dispatch:
permissions: {contents: write}
concurrency:
  group: scalp-lab-v431
  cancel-in-progress: true
jobs:
  research:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - name: START
        run: |
          mkdir -p results
          printf "# V4.31 STATUS\n\nSTARTED\n\n%s\n" "$(date -u)" > results/v431_status.md
          git config user.name "github-actions[bot]"; git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results/v431_status.md; git commit -m "V4.31 started" || true; git push || true
      - run: python -m pip install -r requirements.txt
      - name: Research
        run: |
          set -o pipefail
          python -u research_v431.py 2>&1 | tee results/v431_run.log
      - name: COMPLETE
        if: success()
        run: |
          printf "# V4.31 STATUS\n\nCOMPLETED\n\n%s\n" "$(date -u)" > results/v431_status.md
          git config user.name "github-actions[bot]"; git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results/v431_*.csv results/summary_v431.md results/v431_status.md results/v431_run.log
          git diff --cached --quiet || git commit -m "Add V4.31 results"; git push
      - name: FAILED
        if: failure()
        run: |
          printf "# V4.31 STATUS\n\nFAILED\n\n%s\n" "$(date -u)" > results/v431_status.md
          git config user.name "github-actions[bot]"; git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results/v431_status.md results/v431_run.log || true
          git diff --cached --quiet || git commit -m "V4.31 failed"; git push || true
