name: SCALP LAB V4.3.7 - Stress Test

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validation:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests==2.32.5 pandas==2.2.3 numpy==2.1.3

      - name: Run V4.3.7
        run: |
          python -u research_v437.py \
            --interval 1h \
            --days 730

      - name: Show summary
        if: always()
        run: |
          echo "===== SUMMARY V437 ====="
          if [ -f results/summary_v437.md ]; then
            cat results/summary_v437.md
          else
            echo "summary_v437.md not found"
          fi

      - name: Upload V4.3.7 results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scalp-lab-v437-results
          path: results/
          if-no-files-found: warn
