name: V5.4 Final Data Diagnostic

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: scalp-lab-solusdt-diagnostic
  cancel-in-progress: true

jobs:
  diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: V5.4
        run: python -u diagnostic_v54.py
