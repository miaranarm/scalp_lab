name: SCALP LAB V4.20 Candidate Stability
on:
  push:
    branches: [main]
    paths: [research_v420.py, requirements.txt, .github/workflows/V420.yml]
  workflow_dispatch:
permissions: {contents: write}
concurrency: {group: scalp-lab-research, cancel-in-progress: false}
jobs:
  v420:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - run: pip install -r requirements.txt -q
      - run: python -u research_v420.py
      - if: always()
        run: cat results/summary_v420.md 2>/dev/null || true
      - if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results/v420_*.csv results/summary_v420.md
          git diff --cached --quiet && exit 0
          git commit -m "Research V4.20 candidate stability"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main