name: V504 PULLBACK ROBUSTNESS
on:
  workflow_dispatch:
  push:
    paths: ["research_v504.py",".github/workflows/V504.yml"]
jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - run: pip install -r requirements.txt
      - run: python -u research_v504.py
      - uses: actions/upload-artifact@v4
        with: {name: v504-results, path: results/v504_*.csv}
      - uses: actions/upload-artifact@v4
        with: {name: v504-summary, path: results/summary_v504.md}
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results/v504_*.csv results/summary_v504.md
          git commit -m "results: V504 pullback robustness" || true
          git push || true
