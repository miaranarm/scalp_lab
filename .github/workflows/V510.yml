name: V510 STRICT WALK FORWARD
on:
  workflow_dispatch:
  push:
    paths: ["research_v510.py",".github/workflows/V510.yml"]
jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - run: pip install -r requirements.txt
      - run: python -u research_v510.py
      - uses: actions/upload-artifact@v4
        with: {name: v510-results, path: results/v510_*.csv}
      - uses: actions/upload-artifact@v4
        with: {name: v510-summary, path: results/summary_v510.md}
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results/v510_*.csv results/summary_v510.md
          git commit -m "results: V510 strict walk forward" || true
          git push || true
