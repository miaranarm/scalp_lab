name: V503 META-SCAN
on:
  workflow_dispatch:
  push:
    paths: ["research_v503.py",".github/workflows/V503.yml"]
jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - run: pip install -r requirements.txt
      - run: python -u research_v503.py
      - uses: actions/upload-artifact@v4
        with:
          name: v503-meta-scan
          path: results/meta_*.csv
      - uses: actions/upload-artifact@v4
        with:
          name: v503-summary
          path: results/summary_v503.md
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results/meta_*.csv results/summary_v503.md
          git commit -m "results: V503 meta-scan" || true
          git push || true