name: V4.73 Volatility Squeeze
on:
  push: {paths: [research_v473.py,.github/workflows/V473.yml]}
  workflow_dispatch:
permissions: {contents: write}
concurrency: {group: scalp-lab-v473, cancel-in-progress: true}
jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - run: pip install -r requirements.txt
      - run: python -u research_v473.py 2>&1 | tee results/v473_run.log
      - run: test -s results/v473_oos.csv && test -s results/summary_v473.md
      - if: success()
        run: |
          printf "# V4.73 STATUS\n\nCOMPLETED\n\n%s\n" "$(date -u)" > results/v473_status.md
          git config user.name "github-actions[bot]";git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f results/v473_* results/summary_v473.md;git commit -m "V4.73 results [skip ci]"||true;git push||true
      - if: failure()
        run: |
          printf "# V4.73 STATUS\n\nFAILED\n\n%s\n" "$(date -u)" > results/v473_status.md
          git config user.name "github-actions[bot]";git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f results/v473_*;git commit -m "V4.73 FAILED [skip ci]"||true;git push||true