name: V4.32 Multi-Factor Audit
on:
  push:
    paths: [research_v432.py,.github/workflows/V432.yml]
  workflow_dispatch:
permissions: {contents: write}
concurrency:
  group: scalp-lab-v432
  cancel-in-progress: true
jobs:
  research:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - run: |
          mkdir -p results
          printf "# V4.32 STATUS\n\nSTARTED\n\n%s\n" "$(date -u)" > results/v432_status.md
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results/v432_status.md && git commit -m "V4.32 STARTED" || true
          git push || true
      - run: pip install -r requirements.txt
      - run: python -u research_v432.py 2>&1 | tee results/v432_run.log
      - if: success()
        run: |
          printf "# V4.32 STATUS\n\nCOMPLETED\n\n%s\n" "$(date -u)" > results/v432_status.md
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results && git commit -m "V4.32 results" || true
          git push || true
      - if: failure()
        run: |
          printf "# V4.32 STATUS\n\nFAILED\n\n%s\n" "$(date -u)" > results/v432_status.md
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results/v432_status.md results/v432_run.log && git commit -m "V4.32 FAILED" || true
          git push || true
