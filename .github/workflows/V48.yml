name: SCALP LAB V4.8 Path Forensics

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: scalp-lab-research
  cancel-in-progress: false

jobs:
  v48:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install -r requirements.txt -q

      - name: Run V4.8
        run: python -u research_v48.py

      - name: Results
        if: always()
        run: |
          echo "===== V4.8 ====="
          cat results/summary_v48.md 2>/dev/null || true
          echo ""
          echo "===== GLOBAL ====="
          cat results/v48_global.csv 2>/dev/null || true
          echo ""
          echo "===== PATH ====="
          cat results/v48_path_class.csv 2>/dev/null || true
          echo ""
          echo "===== EXIT/PATH ====="
          cat results/v48_exit_path.csv 2>/dev/null || true
          echo ""
          echo "===== SIGNAL/PATH ====="
          cat results/v48_signal_path.csv 2>/dev/null || true
          echo ""
          echo "===== MARKET/PATH ====="
          cat results/v48_market_path.csv 2>/dev/null || true

      - name: Commit
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research_v48.py .github/workflows/V48.yml results/v48_*.csv results/summary_v48.md
          git diff --cached --quiet && exit 0
          git commit -m "Research V4.8 trade path forensics"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
