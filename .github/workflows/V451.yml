name: SCALP LAB V4.5.1 Forensics

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  v451:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install
        run: pip install -r requirements.txt

      - name: Run V4.5.1
        run: python -u research_v451.py

      - name: Show results
        if: always()
        run: |
          echo "===== V4.5.1 FILES ====="
          ls -lh results/v451*
          echo ""
          echo "===== SUMMARY ====="
          cat results/summary_v451.md

      - name: Commit
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results/v451*
          if git diff --cached --quiet; then
            echo "No changes."
          else
            git commit -m "Research V4.5.1 corrected forensics"
            git push
          fi
