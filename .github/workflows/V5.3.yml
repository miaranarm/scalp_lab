name: V5.3 Futures Gap Repair

on:
  workflow_dispatch:
  schedule:
    - cron: "35 3 * * *"

permissions:
  contents: write

concurrency:
  group: scalp-lab-solusdt-data
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: V5.3
        run: python -u gap_repair_v53.py

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state/live_v4386.json
          git diff --cached --quiet && exit 0
          git commit -m "V5.3 SOLUSDT futures gap repair"
          git pull --rebase origin main
          git push
