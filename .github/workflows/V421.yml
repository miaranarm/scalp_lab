name: SCALP LAB V4.21

on:
  push:
    paths:
      - "research_v421.py"
      - "results/walk_forward_v41.csv"
      - ".github/workflows/V421.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install pandas
      - run: python -u research_v421.py
      - run: cat results/summary_v421.md
      - name: Commit report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results/summary_v421.md
          git diff --cached --quiet || git commit -m "Research V4.21 final holdout audit"
          git push
