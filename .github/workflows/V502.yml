name: V5.02 RSI Reversal Holdout
on:
  push:
    paths: [research_v502.py, .github/workflows/V502.yml]
  workflow_dispatch:
jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - run: pip install -r requirements.txt
      - run: python -u research_v502.py 2>&1 | tee results/v502_run.log
      - run: test -s results/v502_oos.csv && test -s results/v502_params.csv && test -s results/summary_v502.md
      - uses: actions/upload-artifact@v4
        with: {name: v502-results, path: results/v502_*}