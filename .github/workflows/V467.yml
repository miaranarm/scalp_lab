name: V4.67 ORB 24H Bias
on:
  push: {paths: [research_v467.py,.github/workflows/V467.yml]}
  workflow_dispatch:
permissions: {contents: write}
concurrency: {group: scalp-lab-v467, cancel-in-progress: true}
jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - run: pip install -r requirements.txt
      - run: python -u research_v467.py 2>&1 | tee results/v467_run.log
      - run: test -s results/v467_oos.csv && test -s results/summary_v467.md
      - if: success()
        run: |
          printf "# V4.67 STATUS\n\nCOMPLETED\n\n%s\n" "$(date -u)" > results/v467_status.md
          git config user.name "github-actions[bot]";git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f results/v467_* results/summary_v467.md;git commit -m "V4.67 results [skip ci]"||true;git push||true
      - if: failure()
        run: |
          printf "# V4.67 STATUS\n\nFAILED\n\n%s\n" "$(date -u)" > results/v467_status.md
          git config user.name "github-actions[bot]";git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f results/v467_*;git commit -m "V4.67 FAILED [skip ci]"||true;git push||true