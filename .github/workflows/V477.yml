name: V4.77 Shock Final Holdout
on:
  push: {paths: [research_v477.py,.github/workflows/V477.yml]}
  workflow_dispatch:
permissions: {contents: write}
concurrency: {group: scalp-lab-v477, cancel-in-progress: true}
jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - run: pip install -r requirements.txt
      - run: python -u research_v477.py 2>&1 | tee results/v477_run.log
      - run: test -s results/v477_holdout.csv && test -s results/summary_v477.md
      - if: success()
        run: |
          printf "# V4.77 STATUS\n\nCOMPLETED\n\n%s\n" "$(date -u)" > results/v477_status.md
          git config user.name "github-actions[bot]";git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f results/v477_* results/summary_v477.md;git commit -m "V4.77 holdout [skip ci]"||true;git push||true
      - if: failure()
        run: |
          printf "# V4.77 STATUS\n\nFAILED\n\n%s\n" "$(date -u)" > results/v477_status.md
          git config user.name "github-actions[bot]";git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f results/v477_*;git commit -m "V4.77 FAILED [skip ci]"||true;git push||true