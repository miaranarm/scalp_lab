name: V4.82 Shock Volume Walk Forward
on:
  push:
    paths: [research_v482.py, .github/workflows/V482.yml]
  workflow_dispatch:
jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - run: python -u research_v482.py 2>&1 | tee results/v482_run.log
      - run: test -s results/v482_oos.csv && test -s results/summary_v482.md
      - uses: actions/upload-artifact@v4
        with:
          name: v482-results
          path: results/v482_*