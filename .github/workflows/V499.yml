name: V4.99 One-Bar Confirmation
on:
  push:
    paths: [research_v499.py, .github/workflows/V499.yml]
  workflow_dispatch:
jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - run: pip install -r requirements.txt
      - run: python -u research_v499.py 2>&1 | tee results/v499_run.log
      - run: test -s results/v499_oos.csv && test -s results/v499_params.csv && test -s results/summary_v499.md
      - uses: actions/upload-artifact@v4
        with: {name: v499-results, path: results/v499_*}