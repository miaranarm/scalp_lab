name: V4.97 Cost Stress
on:
  push:
    paths: [research_v497.py, .github/workflows/V497.yml]
  workflow_dispatch:
jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - run: pip install -r requirements.txt
      - run: python -u research_v497.py 2>&1 | tee results/v497_run.log
      - run: test -s results/v497_oos.csv && test -s results/summary_v497.md
      - uses: actions/upload-artifact@v4
        with: {name: v497-results, path: results/v497_*}