name: V4.91 Long Breakout External 2024
on:
  push:
    paths: [research_v491.py, .github/workflows/V491.yml]
  workflow_dispatch:
jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - run: pip install -r requirements.txt
      - run: python -u research_v491.py 2>&1 | tee results/v491_run.log
      - run: test -s results/v491_oos.csv && test -s results/summary_v491.md
      - uses: actions/upload-artifact@v4
        with: {name: v491-results, path: results/v491_*}