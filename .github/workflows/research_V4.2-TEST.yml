name: SCALP LAB V4.2 TEST

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  research:
    name: V4.2 TEST - Silent Research
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:

      # ============================================================
      # 1. CHECKOUT
      # ============================================================
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ============================================================
      # 2. PYTHON
      # ============================================================
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      # ============================================================
      # 3. DEPENDENCIES
      # ============================================================
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip -q
          pip install -q requests==2.32.5
          pip install -q pandas==2.2.3
          pip install -q numpy==2.1.3

      # ============================================================
      # 4. BASIC FILE CHECK
      # ============================================================
      - name: Check files
        run: |
          test -f research_v42.py
          test -f research_v41.py
          echo "Files OK."

      # ============================================================
      # 5. BINANCE SOURCE SAFETY CHECK
      # ============================================================
      - name: Check Binance source
        run: |
          if grep -q "api.binance.com/api/v3/klines" research_v42.py; then
            echo "ERROR: Spot REST Binance endpoint detected."
            echo "V4.2 must use Binance Vision USD-M."
            exit 1
          fi

          echo "Binance source check OK."

      # ============================================================
      # 6. CLEAN PREVIOUS RESULTS
      # ============================================================
      - name: Clean results
        run: |
          mkdir -p results

          rm -f results/summary_v42.md
          rm -f results/walk_forward_v42.csv
          rm -f results/stress_test_v42.csv
          rm -f results/robustness_v42.csv

      # ============================================================
      # 7. RUN V4.2 TEST
      #
      # 365 DAYS
      # 3 SYMBOLS
      # 1H
      # NO MONTE CARLO
      #
      # stdout/stderr are redirected to a log file so that the
      # GitHub Actions console stays short.
      # ============================================================
      - name: Run V4.2 TEST
        run: |
          set -o pipefail

          echo "=============================================="
          echo "SCALP LAB V4.2 TEST"
          echo "=============================================="
          echo "Symbols : BTCUSDT ETHUSDT SOLUSDT"
          echo "Interval: 1h"
          echo "History : 365 days"
          echo "MC runs: 0"
          echo "=============================================="

          python -u research_v42.py \
            --symbols "BTCUSDT,ETHUSDT,SOLUSDT" \
            --intervals "1h" \
            --days "365" \
            --capital "100" \
            --mc-runs "0" \
            > /tmp/scalp_v42_test.log 2>&1

      # ============================================================
      # 8. SHOW ONLY IMPORTANT RESULT
      # ============================================================
      - name: Show result
        if: always()
        run: |
          echo ""
          echo "=============================================="
          echo "V4.2 TEST - LAST LOG LINES"
          echo "=============================================="

          if [ -f /tmp/scalp_v42_test.log ]; then
            tail -n 50 /tmp/scalp_v42_test.log
          else
            echo "No execution log found."
          fi

          echo ""
          echo "=============================================="
          echo "GENERATED FILES"
          echo "=============================================="

          ls -lh results/ 2>/dev/null || true

      # ============================================================
      # 9. SHOW SUMMARY ONLY
      # ============================================================
      - name: Show summary
        if: always()
        run: |
          echo ""
          echo "=============================================="
          echo "SUMMARY V4.2"
          echo "=============================================="

          if [ -f results/summary_v42.md ]; then
            tail -n 80 results/summary_v42.md
          else
            echo "summary_v42.md not generated."
          fi

      # ============================================================
      # 10. UPLOAD ARTIFACTS
      # ============================================================
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scalp-lab-v42-test
          path: |
            results/summary_v42.md
            results/walk_forward_v42.csv
            results/stress_test_v42.csv
            results/robustness_v42.csv
            /tmp/scalp_v42_test.log
          if-no-files-found: warn
          retention-days: 14

      # ============================================================
      # 11. COMMIT RESULTS
      # ============================================================
      - name: Commit results
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add results/summary_v42.md
          git add results/walk_forward_v42.csv
          git add results/stress_test_v42.csv
          git add results/robustness_v42.csv

          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "research: SCALP LAB V4.2 TEST"
            git push origin HEAD:main
          fi

      # ============================================================
      # 12. FINAL STATUS
      # ============================================================
      - name: Final status
        if: always()
        run: |
          echo ""
          echo "=============================================="
          echo "SCALP LAB V4.2 TEST FINISHED"
          echo "=============================================="

          if [ -f results/summary_v42.md ]; then
            echo "SUMMARY       : OK"
          else
            echo "SUMMARY       : MISSING"
          fi

          if [ -f results/walk_forward_v42.csv ]; then
            echo "WALK-FORWARD  : OK"
          else
            echo "WALK-FORWARD  : MISSING"
          fi

          if [ -f results/stress_test_v42.csv ]; then
            echo "STRESS TEST   : OK"
          else
            echo "STRESS TEST   : MISSING"
          fi

          if [ -f results/robustness_v42.csv ]; then
            echo "ROBUSTNESS    : OK"
          else
            echo "ROBUSTNESS    : MISSING"
          fi

          echo ""
          echo "=============================================="
