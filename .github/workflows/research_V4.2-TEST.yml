name: SCALP LAB V4.2 TEST

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests==2.32.5 pandas==2.2.3 numpy==2.1.3

      - name: Run V4.2 TEST
        shell: bash
        run: |
          set +e

          LOG="/tmp/v42.log"
          rm -f "$LOG"

          echo "=============================================="
          echo "SCALP LAB V4.2 TEST"
          echo "=============================================="
          echo "Symbols : BTCUSDT ETHUSDT SOLUSDT"
          echo "Interval: 1h"
          echo "History : 365 days"
          echo "MC runs : 0"
          echo "WF      : 180 / 45 / 45 days"
          echo "Holdout : 90 days"
          echo "=============================================="

          python -u research_v42.py \
            --symbols "BTCUSDT,ETHUSDT,SOLUSDT" \
            --intervals "1h" \
            --days "365" \
            --capital "100" \
            --mc-runs "0" \
            > "$LOG" 2>&1

          CODE=$?

          echo ""
          echo "=============================================="
          echo "RESULTAT"
          echo "=============================================="
          echo "Exit code : $CODE"
          echo "Log lines : $(wc -l < "$LOG")"
          echo ""
          echo "----- 10 DERNIERES LIGNES -----"
          tail -n 10 "$LOG"
          echo "----- FIN -----"

          exit $CODE

      - name: Upload full log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scalp-lab-v42-test-log
          path: /tmp/v42.log
          if-no-files-found: warn

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scalp-lab-v42-test-results
          path: |
            results/*.csv
            results/*.md
          if-no-files-found: warn
