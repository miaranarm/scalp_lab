name: SCALP LAB V4.2 TEST

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  research:
    name: V4.2 TEST - Diagnostic
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:

      # ============================================================
      # 1. CHECKOUT
      # ============================================================
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ============================================================
      # 2. PYTHON
      # ============================================================
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      # ============================================================
      # 3. INSTALL DEPENDENCIES
      # ============================================================
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip -q
          pip install -q requests==2.32.5
          pip install -q pandas==2.2.3
          pip install -q numpy==2.1.3

      # ============================================================
      # 4. CHECK FILES
      # ============================================================
      - name: Check files
        run: |
          echo "=============================================="
          echo "FILE CHECK"
          echo "=============================================="

          if [ ! -f research_v42.py ]; then
            echo "ERROR: research_v42.py is missing."
            exit 1
          fi

          if [ ! -f research_v41.py ]; then
            echo "ERROR: research_v41.py is missing."
            exit 1
          fi

          echo "research_v42.py : OK"
          echo "research_v41.py : OK"

      # ============================================================
      # 5. CHECK BINANCE SOURCE
      # ============================================================
      - name: Check Binance source
        run: |
          echo "=============================================="
          echo "BINANCE SOURCE CHECK"
          echo "=============================================="

          if grep -q "api.binance.com/api/v3/klines" research_v42.py; then
            echo ""
            echo "ERROR:"
            echo "research_v42.py still contains:"
            echo "api.binance.com/api/v3/klines"
            echo ""
            echo "This endpoint caused HTTP 451 in GitHub Actions."
            echo "V4.2 must use Binance Vision USD-M."
            exit 1
          fi

          echo "No forbidden Spot REST endpoint detected."

          if grep -q "data.binance.vision" research_v41.py; then
            echo "Binance Vision detected in research_v41.py."
          else
            echo "WARNING: Binance Vision string not detected."
          fi

      # ============================================================
      # 6. PREPARE RESULTS
      # ============================================================
      - name: Prepare results
        run: |
          echo "=============================================="
          echo "PREPARING RESULTS"
          echo "=============================================="

          mkdir -p results

          rm -f results/summary_v42.md
          rm -f results/walk_forward_v42.csv
          rm -f results/stress_test_v42.csv
          rm -f results/robustness_v42.csv

          rm -f /tmp/scalp_v42_test.log

          echo "Results directory ready."

      # ============================================================
      # 7. RUN V4.2 TEST
      #
      # IMPORTANT:
      # We deliberately do NOT use "set -e" here.
      # Python is allowed to fail temporarily so that we can print
      # the real traceback before returning the same exit code.
      # ============================================================
      - name: Run V4.2 TEST
        run: |

          echo ""
          echo "=============================================="
          echo "SCALP LAB V4.2 TEST"
          echo "=============================================="
          echo ""
          echo "Symbols : BTCUSDT ETHUSDT SOLUSDT"
          echo "Interval: 1h"
          echo "History : 365 days"
          echo "MC runs : 0"
          echo ""
          echo "WF TRAIN: 180 days"
          echo "WF TEST : 45 days"
          echo "STEP    : 45 days"
          echo "HOLDOUT : 90 days"
          echo ""
          echo "=============================================="
          echo ""

          set +e

          python -u research_v42.py \
            --symbols "BTCUSDT,ETHUSDT,SOLUSDT" \
            --intervals "1h" \
            --days "365" \
            --capital "100" \
            --mc-runs "0" \
            > /tmp/scalp_v42_test.log 2>&1

          EXIT_CODE=$?

          echo ""
          echo "=============================================="
          echo "V4.2 PYTHON OUTPUT"
          echo "=============================================="
          echo ""

          if [ -f /tmp/scalp_v42_test.log ]; then

            LOG_LINES=$(wc -l < /tmp/scalp_v42_test.log)

            echo "Total log lines: $LOG_LINES"
            echo ""
            echo "----- LAST 100 LINES -----"
            echo ""

            tail -n 100 /tmp/scalp_v42_test.log

            echo ""
            echo "----- END LOG -----"

          else

            echo "ERROR: Python log was not generated."

          fi

          echo ""
          echo "=============================================="
          echo "PYTHON EXIT CODE: $EXIT_CODE"
          echo "=============================================="
          echo ""

          exit $EXIT_CODE

      # ============================================================
      # 8. SHOW GENERATED FILES
      # ============================================================
      - name: Show generated files
        if: always()
        run: |

          echo ""
          echo "=============================================="
          echo "GENERATED FILES"
          echo "=============================================="
          echo ""

          if [ -d results ]; then
            find results -maxdepth 1 -type f \
              -printf '%f  %s bytes\n' | sort
          else
            echo "results directory does not exist."
          fi

      # ============================================================
      # 9. SHOW SUMMARY
      # ============================================================
      - name: Show summary
        if: always()
        run: |

          echo ""
          echo "=============================================="
          echo "V4.2 SUMMARY"
          echo "=============================================="
          echo ""

          if [ -f results/summary_v42.md ]; then
            cat results/summary_v42.md
          else
            echo "summary_v42.md was not generated."
          fi

      # ============================================================
      # 10. SHOW ROBUSTNESS
      # ============================================================
      - name: Show robustness result
        if: always()
        run: |

          echo ""
          echo "=============================================="
          echo "V4.2 ROBUSTNESS"
          echo "=============================================="
          echo ""

          if [ -f results/robustness_v42.csv ]; then
            echo "robustness_v42.csv:"
            echo ""
            head -n 30 results/robustness_v42.csv
          else
            echo "robustness_v42.csv was not generated."
          fi

      # ============================================================
      # 11. UPLOAD ARTIFACTS
      # ============================================================
      - name: Upload V4.2 TEST artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scalp-lab-v42-test
          path: |
            results/summary_v42.md
            results/walk_forward_v42.csv
            results/stress_test_v42.csv
            results/robustness_v42.csv
            /tmp/scalp_v42_test.log
          if-no-files-found: warn
          retention-days: 14

      # ============================================================
      # 12. COMMIT RESULTS
      #
      # Only successful research is committed.
      # ============================================================
      - name: Commit results
        if: success()
        run: |

          echo ""
          echo "=============================================="
          echo "COMMIT V4.2 TEST RESULTS"
          echo "=============================================="
          echo ""

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add results/summary_v42.md
          git add results/walk_forward_v42.csv
          git add results/stress_test_v42.csv
          git add results/robustness_v42.csv

          if git diff --cached --quiet; then

            echo "No result changes to commit."

          else

            git commit -m "research: SCALP LAB V4.2 TEST"
            git push origin HEAD:main

          fi

      # ============================================================
      # 13. FINAL STATUS
      # ============================================================
      - name: Final status
        if: always()
        run: |

          echo ""
          echo "=============================================="
          echo "SCALP LAB V4.2 TEST - FINAL STATUS"
          echo "=============================================="
          echo ""

          if [ -f results/summary_v42.md ]; then
            echo "SUMMARY       : OK"
          else
            echo "SUMMARY       : MISSING"
          fi

          if [ -f results/walk_forward_v42.csv ]; then
            echo "WALK-FORWARD  : OK"
          else
            echo "WALK-FORWARD  : MISSING"
          fi

          if [ -f results/stress_test_v42.csv ]; then
            echo "STRESS TEST   : OK"
          else
            echo "STRESS TEST   : MISSING"
          fi

          if [ -f results/robustness_v42.csv ]; then
            echo "ROBUSTNESS    : OK"
          else
            echo "ROBUSTNESS    : MISSING"
          fi

          echo ""
          echo "=============================================="
