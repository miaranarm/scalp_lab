name: V4.64 Pair Trading
on:
  push: {paths: [research_v464.py,.github/workflows/V464.yml]}
  workflow_dispatch:
permissions: {contents: write}
concurrency: {group: scalp-lab-v464, cancel-in-progress: true}
jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - run: pip install -r requirements.txt
      - run: python -u research_v464.py 2>&1 | tee results/v464_run.log
      - run: test -s results/v464_oos.csv && test -s results/summary_v464.md
      - if: success()
        run: |
          printf "# V4.64 STATUS\n\nCOMPLETED\n\n%s\n" "$(date -u)" > results/v464_status.md
          git config user.name "github-actions[bot]";git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f results/v464_* results/summary_v464.md;git commit -m "V4.64 results [skip ci]"||true;git push||true
      - if: failure()
        run: |
          printf "# V4.64 STATUS\n\nFAILED\n\n%s\n" "$(date -u)" > results/v464_status.md
          git config user.name "github-actions[bot]";git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f results/v464_*;git commit -m "V4.64 FAILED [skip ci]"||true;git push||true