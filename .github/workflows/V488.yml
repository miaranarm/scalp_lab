name: V4.88 Time Series Momentum
on:
  push:
    paths: [research_v488.py, .github/workflows/V488.yml]
  workflow_dispatch:
jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - run: pip install -r requirements.txt
      - run: python -u research_v488.py 2>&1 | tee results/v488_run.log
      - run: test -s results/v488_oos.csv && test -s results/summary_v488.md
      - uses: actions/upload-artifact@v4
        with: {name: v488-results, path: results/v488_*}