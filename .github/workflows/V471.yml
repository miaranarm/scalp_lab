name: V4.71 Wick Volume Reversal
on:
  push: {paths: [research_v471.py,.github/workflows/V471.yml]}
  workflow_dispatch:
permissions: {contents: write}
concurrency: {group: scalp-lab-v471, cancel-in-progress: true}
jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - run: pip install -r requirements.txt
      - run: python -u research_v471.py 2>&1 | tee results/v471_run.log
      - run: test -s results/v471_oos.csv && test -s results/summary_v471.md
      - if: success()
        run: |
          printf "# V4.71 STATUS\n\nCOMPLETED\n\n%s\n" "$(date -u)" > results/v471_status.md
          git config user.name "github-actions[bot]";git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f results/v471_* results/summary_v471.md;git commit -m "V4.71 results [skip ci]"||true;git push||true
      - if: failure()
        run: |
          printf "# V4.71 STATUS\n\nFAILED\n\n%s\n" "$(date -u)" > results/v471_status.md
          git config user.name "github-actions[bot]";git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f results/v471_*;git commit -m "V4.71 FAILED [skip ci]"||true;git push||true