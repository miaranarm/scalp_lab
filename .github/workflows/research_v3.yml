name: Research V3

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  research-v2:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy requests

      - name: Run Research V3
        env:
          PYTHONUNBUFFERED: "1"
        run: |
          python -u research_v3.py \
            --symbols "BTCUSDT,ETHUSDT,SOLUSDT" \
            --intervals "5m,15m" \
            --days "365" \
            --capital "100"

      - name: Show generated results
        if: always()
        run: |
          echo "===== RESULTS DIRECTORY ====="
          if [ -d results ]; then
            find results -maxdepth 2 -type f -print
          else
            echo "results/ directory not found"
          fi

          echo ""
          echo "===== SUMMARY V3 ====="
          if [ -f results/summary_v3.md ]; then
            cat results/summary_v3.md
          else
            echo "summary_v3.md not found"
          fi

      - name: Commit V3 results
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add results/

          if git diff --cached --quiet; then
            echo "No result changes to commit."
          else
            git commit -m "Research V2 results"
            git push
          fi
