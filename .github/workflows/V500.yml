name: V5.00 Mean Reversion Holdout
on:
  push:
    paths: [research_v500.py, .github/workflows/V500.yml]
  workflow_dispatch:
jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - run: pip install -r requirements.txt
      - run: python -u research_v500.py 2>&1 | tee results/v500_run.log
      - run: test -s results/v500_oos.csv && test -s results/v500_params.csv && test -s results/summary_v500.md
      - uses: actions/upload-artifact@v4
        with: {name: v500-results, path: results/v500_*}