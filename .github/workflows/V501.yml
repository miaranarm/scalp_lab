name: V5.01 Donchian Breakout Holdout
on:
  push:
    paths: [research_v501.py, .github/workflows/V501.yml]
  workflow_dispatch:
jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - run: pip install -r requirements.txt
      - run: python -u research_v501.py 2>&1 | tee results/v501_run.log
      - run: test -s results/v501_oos.csv && test -s results/v501_params.csv && test -s results/summary_v501.md
      - uses: actions/upload-artifact@v4
        with: {name: v501-results, path: results/v501_*}