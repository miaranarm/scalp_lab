name: V4.98 Fixed Holdout
on:
  push:
    paths: [research_v498.py, .github/workflows/V498.yml]
  workflow_dispatch:
jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - run: pip install -r requirements.txt
      - run: python -u research_v498.py 2>&1 | tee results/v498_run.log
      - run: test -s results/v498_oos.csv && test -s results/v498_params.csv && test -s results/summary_v498.md
      - uses: actions/upload-artifact@v4
        with: {name: v498-results, path: results/v498_*}