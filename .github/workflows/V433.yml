name: V4.33 Microstructure Audit
on:
  push:
    paths: [research_v433.py,.github/workflows/V433.yml]
  workflow_dispatch:
permissions: {contents: write}
concurrency: {group: scalp-lab-v433, cancel-in-progress: true}
jobs:
  research:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - run: pip install -r requirements.txt
      - run: |
          set -o pipefail
          python -u research_v433.py 2>&1 | tee results/v433_run.log
      - run: |
          test -s results/v433_holdout.csv
          test -s results/summary_v433.md
      - if: success()
        run: |
          printf "# V4.33 STATUS\n\nCOMPLETED\n\n%s\n" "$(date -u)" > results/v433_status.md
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results
          git commit -m "V4.33 results" || true
          git push
      - if: failure()
        run: |
          printf "# V4.33 STATUS\n\nFAILED\n\n%s\n" "$(date -u)" > results/v433_status.md
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results
          git commit -m "V4.33 FAILED" || true
          git push || true