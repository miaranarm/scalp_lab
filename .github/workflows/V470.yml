name: V4.70 Final Holdout
on:
  push: {paths: [research_v470.py,.github/workflows/V470.yml]}
  workflow_dispatch:
permissions: {contents: write}
concurrency: {group: scalp-lab-v470, cancel-in-progress: true}
jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - run: pip install -r requirements.txt
      - run: python -u research_v470.py 2>&1 | tee results/v470_run.log
      - run: test -s results/v470_holdout.csv && test -s results/summary_v470.md
      - if: success()
        run: |
          printf "# V4.70 STATUS\n\nCOMPLETED\n\n%s\n" "$(date -u)" > results/v470_status.md
          git config user.name "github-actions[bot]";git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f results/v470_* results/summary_v470.md;git commit -m "V4.70 holdout [skip ci]"||true;git push||true
      - if: failure()
        run: |
          printf "# V4.70 STATUS\n\nFAILED\n\n%s\n" "$(date -u)" > results/v470_status.md
          git config user.name "github-actions[bot]";git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f results/v470_*;git commit -m "V4.70 FAILED [skip ci]"||true;git push||true