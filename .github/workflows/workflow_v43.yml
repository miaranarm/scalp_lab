name: SCALP LAB V4.3.5

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install -q --upgrade pip
          pip install -q requests==2.32.5 pandas==2.2.3 numpy==2.1.3

      - name: Clean results
        run: |
          rm -rf results
          mkdir -p results

      - name: Run V4.3.5
        run: |
          python -u research_v43.py \
            --symbols BTCUSDT ETHUSDT SOLUSDT \
            --intervals 1h \
            --days 730 \
            --top 10 \
            --random-runs 20

      - name: Show results
        if: always()
        run: |
          echo "===== SUMMARY ====="
          cat results/summary_v435.md 2>/dev/null || true
          echo
          echo "===== FILES ====="
          ls -lh results/ 2>/dev/null || true

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scalp-lab-v435-results
          path: results/*
          retention-days: 30
