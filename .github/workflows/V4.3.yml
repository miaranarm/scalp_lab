name: SCALP LAB V4.3 Edge Isolation

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  edge-isolation:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install
        run: pip install -q pandas numpy

      - name: Run V4.3
        run: python -u research_v43.py

      - name: Show report
        if: always()
        run: |
          echo "===== V4.3 ====="
          cat results/summary_v43.md
          echo ""
          echo "===== FILES ====="
          ls -lh results/v43_*

      - name: Commit
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research_v43.py results/
          if git diff --cached --quiet; then
            echo "Nothing to commit."
          else
            git commit -m "Research V4.3 edge isolation"
            git push
          fi
