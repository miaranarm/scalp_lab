name: V4.57 SOL Walk Forward
on:
  push: {paths: [research_v457.py,.github/workflows/V457.yml]}
  workflow_dispatch:
permissions: {contents: write}
concurrency: {group: scalp-lab-v457, cancel-in-progress: true}
jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - run: pip install -r requirements.txt
      - run: python -u research_v457.py 2>&1 | tee results/v457_run.log
      - run: test -s results/v457_holdout.csv && test -s results/summary_v457.md
      - if: success()
        run: |
          printf "# V4.57 STATUS\n\nCOMPLETED\n\n%s\n" "$(date -u)" > results/v457_status.md
          git config user.name "github-actions[bot]"; git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results; git commit -m "V4.57 results" || true; git push
      - if: failure()
        run: |
          printf "# V4.57 STATUS\n\nFAILED\n\n%s\n" "$(date -u)" > results/v457_status.md
          git config user.name "github-actions[bot]"; git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results; git commit -m "V4.57 FAILED" || true; git push || true