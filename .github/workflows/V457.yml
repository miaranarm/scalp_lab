name: SCALP LAB V4.5.7

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: scalp-lab-research
  cancel-in-progress: false

jobs:
  v457:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install
        run: pip install -r requirements.txt

      - name: Run
        run: python -u research_v457.py

      - name: Compact report
        if: always()
        run: |
          echo "===== V4.5.7 ====="
          [ -f results/summary_v457.md ] && cat results/summary_v457.md || true
          echo ""
          echo "===== MISSED TP ====="
          [ -f results/v457_missed_tp_forensics.csv ] && \
            head -20 results/v457_missed_tp_forensics.csv || true
          echo ""
          echo "===== CLASSIFICATION ====="
          [ -f results/v457_classification.csv ] && \
            cat results/v457_classification.csv || true
          echo ""
          echo "===== SYMBOL / INTERVAL ====="
          [ -f results/v457_symbol_interval.csv ] && \
            cat results/v457_symbol_interval.csv || true
          echo ""
          echo "===== STRATEGIES ====="
          [ -f results/v457_strategy.csv ] && \
            cat results/v457_strategy.csv | head -30 || true

      - name: Commit
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results/v457_*.csv results/summary_v457.md
          git diff --cached --quiet && exit 0
          git commit -m "Research V4.5.7"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
