name: SCALP LAB V4.5.3 Forensics

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  v453:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install
        run: pip install -r requirements.txt

      - name: Run V4.5.3
        run: python -u research_v453.py

      - name: Show results
        if: always()
        run: |
          echo "===== V4.5.3 FILES ====="
          ls -lh results/v453* 2>/dev/null || true
          echo ""
          echo "===== SUMMARY ====="
          if [ -f results/summary_v453.md ]; then
            cat results/summary_v453.md
          else
            echo "summary_v453.md not found"
          fi

      - name: Commit
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add results/v453* 2>/dev/null || true

          if git diff --cached --quiet; then
            echo "No V4.5.3 result changes."
          else
            git commit -m "Research V4.5.3 trade forensics"
            git push
          fi
