name: V4.53 SOL Monthly OOS
on:
  push: {paths: [research_v453.py,.github/workflows/V453.yml]}
  workflow_dispatch:
permissions: {contents: write}
concurrency: {group: scalp-lab-v453, cancel-in-progress: true}
jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - run: pip install -r requirements.txt
      - run: python -u research_v453.py 2>&1 | tee results/v453_run.log
      - run: test -s results/v453_holdout.csv && test -s results/summary_v453.md
      - if: success()
        run: |
          printf "# V4.53 STATUS\n\nFAILED\n\n%s\n" "$(date -u)" > results/v453_status.md
          git config user.name "github-actions[bot]"; git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results; git commit -m "V4.53 FAILED" || true; git push || true