name: SCALP LAB V4.2 Research

on:
  workflow_dispatch:
    inputs:
      symbols:
        description: "Symboles Binance"
        required: true
        default: "BTCUSDT,ETHUSDT,SOLUSDT"

      interval:
        description: "Intervalle"
        required: true
        default: "1h"

      days:
        description: "Historique en jours"
        required: true
        default: "730"

      capital:
        description: "Capital de recherche"
        required: true
        default: "100"

      mc_runs:
        description: "Nombre de simulations Monte Carlo"
        required: true
        default: "5000"

permissions:
  contents: write

jobs:
  research:
    name: SCALP LAB V4.2
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:

      # ======================================================
      # CHECKOUT
      # ======================================================

      - name: Checkout repository
        uses: actions/checkout@v4

      # ======================================================
      # PYTHON
      # ======================================================

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      # ======================================================
      # DEPENDENCIES
      # ======================================================

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # ======================================================
      # ENVIRONMENT INFO
      # ======================================================

      - name: Show environment
        run: |
          python --version
          pip --version
          echo "Repository: $GITHUB_REPOSITORY"
          echo "Branch: $GITHUB_REF_NAME"
          echo "Commit: $GITHUB_SHA"

      # ======================================================
      # RUN V4.2
      # ======================================================

      - name: Run SCALP LAB V4.2
        run: |
          python -u research_v42.py \
            --symbols "${{ github.event.inputs.symbols }}" \
            --intervals "${{ github.event.inputs.interval }}" \
            --days "${{ github.event.inputs.days }}" \
            --capital "${{ github.event.inputs.capital }}" \
            --mc-runs "${{ github.event.inputs.mc_runs }}"

      # ======================================================
      # DISPLAY RESULTS
      # ======================================================

      - name: Display research summary
        if: always()
        run: |
          echo "=============================================="
          echo "SCALP LAB V4.2 SUMMARY"
          echo "=============================================="

          if [ -f results/summary_v42.md ]; then
            cat results/summary_v42.md
          else
            echo "summary_v42.md introuvable"
          fi

      # ======================================================
      # UPLOAD RESULTS AS ARTIFACT
      # ======================================================

      - name: Upload V4.2 research results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scalp-lab-v42-results
          path: |
            results/summary_v42.md
            results/walk_forward_v42.csv
            results/robustness_v42.csv
            results/global_v42.csv
            results/holdout_v42.csv
          if-no-files-found: warn

      # ======================================================
      # COMMIT RESULTS
      # ======================================================

      - name: Commit research results
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add results/

          if git diff --cached --quiet; then
            echo "Aucun changement à commit."
          else
            git commit -m "research: SCALP LAB V4.2 results"
            git push
          fi
