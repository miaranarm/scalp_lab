name: V506 META ROBUST OOS
on:
  workflow_dispatch:
  push:
    paths: ["research_v506.py",".github/workflows/V506.yml"]
jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - run: pip install -r requirements.txt
      - run: python -u research_v506.py
      - uses: actions/upload-artifact@v4
        with: {name: v506-results, path: results/v506_*.csv}
      - uses: actions/upload-artifact@v4
        with: {name: v506-summary, path: results/summary_v506.md}
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results/v506_*.csv results/summary_v506.md
          git commit -m "results: V506 meta robust OOS" || true
          git push || true
