name: V4.63 Cross Sectional Reversal
on:
  push: {paths: [research_v463.py,.github/workflows/V463.yml]}
  workflow_dispatch:
permissions: {contents: write}
concurrency: {group: scalp-lab-v463, cancel-in-progress: true}
jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - run: pip install -r requirements.txt
      - run: python -u research_v463.py 2>&1 | tee results/v463_run.log
      - run: test -s results/v463_oos.csv && test -s results/summary_v463.md
      - if: success()
        run: |
          printf "# V4.63 STATUS\n\nCOMPLETED\n\n%s\n" "$(date -u)" > results/v463_status.md
          git config user.name "github-actions[bot]";git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f results/v463_* results/summary_v463.md;git commit -m "V4.63 results [skip ci]"||true;git push||true
      - if: failure()
        run: |
          printf "# V4.63 STATUS\n\nFAILED\n\n%s\n" "$(date -u)" > results/v463_status.md
          git config user.name "github-actions[bot]";git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f results/v463_*;git commit -m "V4.63 FAILED [skip ci]"||true;git push||true