name: SCALP LAB V4.5.2 Forensics

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  v452:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install
        run: pip install -r requirements.txt

      - name: Run V4.5.2
        run: python -u research_v452.py

      - name: Show results
        if: always()
        run: |
          echo "===== V4.5.2 FILES ====="
          ls -lh results/v452* || true
          echo ""
          echo "===== SUMMARY ====="
          if [ -f results/summary_v452.md ]; then
            cat results/summary_v452.md
          else
            echo "summary_v452.md not found"
          fi

      - name: Commit
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results/v452*
          if git diff --cached --quiet; then
            echo "No changes."
          else
            git commit -m "Research V4.5.2 trade forensics"
            git push
          fi
