name: V4.94 Shock Trend
on:
  push:
    paths: [research_v494.py, .github/workflows/V494.yml]
  workflow_dispatch:
jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - run: pip install -r requirements.txt
      - run: python -u research_v494.py 2>&1 | tee results/v494_run.log
      - run: test -s results/v494_oos.csv && test -s results/summary_v494.md
      - uses: actions/upload-artifact@v4
        with: {name: v494-results, path: results/v494_*}