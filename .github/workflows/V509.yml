name: V509 WALK FORWARD
on:
  workflow_dispatch:
  push:
    paths: ["research_v509.py",".github/workflows/V509.yml"]
jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - run: pip install -r requirements.txt
      - run: python -u research_v509.py
      - uses: actions/upload-artifact@v4
        with: {name: v509-results, path: results/v509_*.csv}
      - uses: actions/upload-artifact@v4
        with: {name: v509-summary, path: results/summary_v509.md}
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results/v509_*.csv results/summary_v509.md
          git commit -m "results: V509 walk forward" || true
          git push || true
