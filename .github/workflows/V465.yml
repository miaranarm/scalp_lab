name: V4.65 Daily Opening Range
on:
  push: {paths: [research_v465.py,.github/workflows/V465.yml]}
  workflow_dispatch:
permissions: {contents: write}
concurrency: {group: scalp-lab-v465, cancel-in-progress: true}
jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - run: pip install -r requirements.txt
      - run: python -u research_v465.py 2>&1 | tee results/v465_run.log
      - run: test -s results/v465_oos.csv && test -s results/summary_v465.md
      - if: success()
        run: |
          printf "# V4.65 STATUS\n\nCOMPLETED\n\n%s\n" "$(date -u)" > results/v465_status.md
          git config user.name "github-actions[bot]";git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f results/v465_* results/summary_v465.md;git commit -m "V4.65 results [skip ci]"||true;git push||true
      - if: failure()
        run: |
          printf "# V4.65 STATUS\n\nFAILED\n\n%s\n" "$(date -u)" > results/v465_status.md
          git config user.name "github-actions[bot]";git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f results/v465_*;git commit -m "V4.65 FAILED [skip ci]"||true;git push||true