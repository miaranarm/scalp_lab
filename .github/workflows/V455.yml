name: SCALP LAB V4.5.5 TP Unit Audit

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  v455:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install
        run: pip install -r requirements.txt

      - name: Run V4.5.5
        run: python -u research_v455.py

      - name: Show results
        if: always()
        run: |
          echo "===== V4.5.5 ====="
          ls -lh results/v455* 2>/dev/null || true
          echo ""
          echo "===== SUMMARY ====="
          cat results/summary_v455.md 2>/dev/null || true
          echo ""
          echo "===== RAW SAMPLE ====="
          python - <<'PY'
          import pandas as pd
          f="results/v455_tp_audit.csv"
          try:
              d=pd.read_csv(f)
              print(d.head(12).to_string(index=False))
          except Exception as e:
              print(e)
          PY

      - name: Commit
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results/v455* 2>/dev/null || true

          if git diff --cached --quiet; then
            echo "No V4.5.5 changes."
          else
            git commit -m "Research V4.5.5 TP unit audit"
            git push
          fi
