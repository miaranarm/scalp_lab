name: V4.62 Cross Sectional Momentum
on:
  push: {paths: [research_v462.py,.github/workflows/V462.yml]}
  workflow_dispatch:
permissions: {contents: write}
concurrency: {group: scalp-lab-v462, cancel-in-progress: true}
jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - run: pip install -r requirements.txt
      - run: python -u research_v462.py 2>&1 | tee results/v462_run.log
      - run: test -s results/v462_oos.csv && test -s results/summary_v462.md
      - if: success()
        run: |
          printf "# V4.62 STATUS\n\nCOMPLETED\n\n%s\n" "$(date -u)" > results/v462_status.md
          git config user.name "github-actions[bot]";git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f results/v462_* results/summary_v462.md;git commit -m "V4.62 results [skip ci]"||true;git push||true
      - if: failure()
        run: |
          printf "# V4.62 STATUS\n\nFAILED\n\n%s\n" "$(date -u)" > results/v462_status.md
          git config user.name "github-actions[bot]";git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f results/v462_*;git commit -m "V4.62 FAILED [skip ci]"||true;git push||true