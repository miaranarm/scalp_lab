name: V4.74 Squeeze Volume
on:
  push: {paths: [research_v474.py,.github/workflows/V474.yml]}
  workflow_dispatch:
permissions: {contents: write}
concurrency: {group: scalp-lab-v474, cancel-in-progress: true}
jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - run: pip install -r requirements.txt
      - run: python -u research_v474.py 2>&1 | tee results/v474_run.log
      - run: test -s results/v474_oos.csv && test -s results/summary_v474.md
      - if: success()
        run: |
          printf "# V4.74 STATUS\n\nCOMPLETED\n\n%s\n" "$(date -u)" > results/v474_status.md
          git config user.name "github-actions[bot]";git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f results/v474_* results/summary_v474.md;git commit -m "V4.74 results [skip ci]"||true;git push||true
      - if: failure()
        run: |
          printf "# V4.74 STATUS\n\nFAILED\n\n%s\n" "$(date -u)" > results/v474_status.md
          git config user.name "github-actions[bot]";git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f results/v474_*;git commit -m "V4.74 FAILED [skip ci]"||true;git push||true