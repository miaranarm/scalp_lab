name: V4.83 External Holdout
on:
  push:
    paths: [research_v483.py, .github/workflows/V483.yml]
  workflow_dispatch:
jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - run: pip install -r requirements.txt
      - run: python -u research_v483.py 2>&1 | tee results/v483_run.log
      - run: test -s results/v483_oos.csv && test -s results/summary_v483.md
      - uses: actions/upload-artifact@v4
        with:
          name: v483-results
          path: results/v483_*