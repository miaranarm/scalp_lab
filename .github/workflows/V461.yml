name: V4.61 Hourly Seasonality
on:
  push: {paths: [research_v461.py,.github/workflows/V461.yml]}
  workflow_dispatch:
permissions: {contents: write}
concurrency: {group: scalp-lab-v461, cancel-in-progress: true}
jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - run: pip install -r requirements.txt
      - run: python -u research_v461.py 2>&1 | tee results/v461_run.log
      - run: test -s results/v461_oos.csv && test -s results/summary_v461.md
      - if: success()
        run: |
          printf "# V4.61 STATUS\n\nCOMPLETED\n\n%s\n" "$(date -u)" > results/v461_status.md
          git config user.name "github-actions[bot]";git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f results/v461_* results/summary_v461.md;git commit -m "V4.61 results [skip ci]"||true;git push||true
      - if: failure()
        run: |
          printf "# V4.61 STATUS\n\nFAILED\n\n%s\n" "$(date -u)" > results/v461_status.md
          git config user.name "github-actions[bot]";git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f results/v461_*;git commit -m "V4.61 FAILED [skip ci]"||true;git push||true