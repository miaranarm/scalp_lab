name: V4.79 Winner Market Filter
on:
  push: {paths: [research_v479.py,.github/workflows/V479.yml]}
  workflow_dispatch:
permissions: {contents: write}
concurrency: {group: scalp-lab-v479, cancel-in-progress: true}
jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - run: pip install -r requirements.txt
      - run: python -u research_v479.py 2>&1 | tee results/v479_run.log
      - run: test -s results/v479_oos.csv && test -s results/summary_v479.md
      - if: success()
        run: |
          printf "# V4.79 STATUS\n\nCOMPLETED\n\n%s\n" "$(date -u)" > results/v479_status.md
          git config user.name "github-actions[bot]";git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f results/v479_* results/summary_v479.md;git commit -m "V4.79 results [skip ci]"||true;git push||true