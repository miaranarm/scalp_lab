name: V4.76 Shock Realistic Cost
on:
  push: {paths: [research_v476.py,.github/workflows/V476.yml]}
  workflow_dispatch:
permissions: {contents: write}
concurrency: {group: scalp-lab-v476, cancel-in-progress: true}
jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - run: pip install -r requirements.txt
      - run: python -u research_v476.py 2>&1 | tee results/v476_run.log
      - run: test -s results/v476_oos.csv && test -s results/summary_v476.md
      - if: success()
        run: |
          printf "# V4.76 STATUS\n\nCOMPLETED\n\n%s\n" "$(date -u)" > results/v476_status.md
          git config user.name "github-actions[bot]";git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f results/v476_* results/summary_v476.md;git commit -m "V4.76 results [skip ci]"||true;git push||true