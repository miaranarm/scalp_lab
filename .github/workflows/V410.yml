name: SCALP LAB V4.10

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: scalp-lab-research
  cancel-in-progress: false

jobs:
  v410:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install -r requirements.txt -q

      - name: Run
        run: python -u research_v410.py

      - name: Compact results
        if: always()
        run: |
          echo "===== V4.10 ====="
          cat results/summary_v410.md | head -120

      - name: Commit
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research_v410.py \
            .github/workflows/V410.yml \
            results/v410_*.csv \
            results/summary_v410.md
          git diff --cached --quiet && exit 0
          git commit -m "Research V4.10 entry timing"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
