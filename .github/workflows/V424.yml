name: SCALP LAB V4.24
on:
  push:
    paths: [research_v424.py, .github/workflows/V424.yml]
  workflow_dispatch:
jobs:
  research:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - run: pip install -r requirements.txt
      - run: python -u research_v424.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results/v424_*.csv results/summary_v424.md
          git diff --cached --quiet || git commit -m "Add V4.24 UTC hour seasonality research"
          git push
