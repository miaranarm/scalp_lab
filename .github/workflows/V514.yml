name: V514 15m STRICT SCALP
on:
  push:
    paths:
      - "research_v514.py"
      - ".github/workflows/V514.yml"
  workflow_dispatch:
jobs:
  scan:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - run: python -u research_v514.py
      - uses: actions/upload-artifact@v4
        with:
          name: v514-results
          path: results/v514_*
      - name: Publish results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results/v514_*
          git add results/summary_v514.md
          git diff --cached --quiet || git commit -m "Update V514 results"
          git pull --rebase origin main
          git push
