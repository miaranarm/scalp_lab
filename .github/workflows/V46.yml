name: SCALP LAB V4.6 Forensics

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: scalp-lab-research
  cancel-in-progress: false

jobs:
  v46:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install -r requirements.txt -q

      - name: Run V4.6
        run: python -u research_v46.py

      - name: Results
        if: always()
        run: |
          echo "===== V4.6 ====="
          if [ -f results/summary_v46.md ]; then
            cat results/summary_v46.md
          fi
          echo ""
          echo "===== GLOBAL ====="
          if [ -f results/v46_global.csv ]; then
            cat results/v46_global.csv
          fi
          echo ""
          echo "===== EXCURSION ====="
          if [ -f results/v46_excursion_classes.csv ]; then
            cat results/v46_excursion_classes.csv
          fi
          echo ""
          echo "===== EXIT ====="
          if [ -f results/v46_exit.csv ]; then
            cat results/v46_exit.csv
          fi
          echo ""
          echo "===== SIGNAL ====="
          if [ -f results/v46_signal.csv ]; then
            cat results/v46_signal.csv
          fi

      - name: Commit
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research_v46.py .github/workflows/V46.yml results/v46_*.csv results/summary_v46.md
          git diff --cached --quiet && exit 0
          git commit -m "Research V4.6 entry excursion forensics"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
